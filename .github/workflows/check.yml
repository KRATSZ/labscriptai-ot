name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash install-labscriptai-ot.sh
      - run: node scripts/lint-manifests.mjs
      - run: npm --prefix servers/opentrons-mcp test
      - run: .venv/bin/python -m unittest discover -s automation/flex3d/tests -v
        env:
          PYTHONPATH: automation/flex3d
      - run: python3 -m unittest discover -s scripts -p 'test_package_labscriptai_ot.py' -v
